; HW-364A : ESP8266 (ESP-12F) with soldered-on 0.96" SSD1306 128x64 OLED.
; The panel is two-colour: rows 0..15 yellow, 16..63 blue.
;
; Two UI designs share one data layer. Pick one:
;   pio run -e design1 -t upload    swiping card carousel
;   pio run -e design2 -t upload    auto-focus hero
[platformio]
default_envs = design4

[common]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
board_build.f_cpu = 160000000L
lib_deps      = olikraus/U8g2@^2.35.30
                bblanchon/ArduinoJson@^7.0.4
build_flags   = -Wall -I src

[env:design1]
extends          = common
build_src_filter = +<common/*> -<common/fobdata.cpp> -<common/weather.cpp> +<design1/*>

[env:design2]
extends          = common
build_src_filter = +<common/*> -<common/fobdata.cpp> -<common/weather.cpp> +<design2/*>

[env:design3]
extends          = common
build_src_filter = +<common/*> -<common/fobdata.cpp> +<design3/*>

[env:design4]
extends          = common
build_src_filter = +<common/*> -<common/weather.cpp> +<design4/*>

[env:weather]
extends          = common
build_src_filter = -<*> +<common/oled.cpp> +<weather/>
lib_deps         = olikraus/U8g2@^2.35.30
                   bblanchon/ArduinoJson@^7.0.4
                   tzapu/WiFiManager@^2.0.17

[env:diag]
extends          = common
build_src_filter = +<diag/*>
